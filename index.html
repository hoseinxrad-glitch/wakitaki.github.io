<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>واکی تاکی آنلاین | گفتگوی صوتی و تصویری زنده</title>
<meta name="description" content="واکی تاکی آنلاین رایگان: با نگه داشتن یک دکمه صحبت کنید، چت کنید و تصویر وبکم بفرستید.">
<meta name="theme-color" content="#0b0f14">
<link rel="canonical" href="https://hoseinxrad-glitch.github.io/wakitaki.github.io/">
<meta property="og:title" content="واکی تاکی آنلاین"><meta property="og:type" content="website"><meta property="og:url" content="https://hoseinxrad-glitch.github.io/wakitaki.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f14; --surface:#141a22; --surface2:#1c2530; --line:#263140; --text:#e8edf3; --muted:#8794a6;
          --tx:#ffb020; --rx:#3ddc97; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { font-family: 'Vazirmatn', system-ui, sans-serif; color: var(--text);
    background: radial-gradient(900px 520px at 50% -10%, #17382f 0%, transparent 60%),
                radial-gradient(700px 420px at 100% 100%, #2b2112 0%, transparent 60%), var(--bg);
    background-attachment: fixed; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; padding: 12px 14px; font: 400 16px 'Vazirmatn', sans-serif; color: var(--text);
    background: #0d1218; border: 1px solid var(--line); border-radius: 12px; }
  input::placeholder { color: #5d6a7b; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--rx); outline-offset: 2px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.3px; }
  .sub { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin: 10px 0 0; }
  .btn, .go { width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    font: 800 17px 'Vazirmatn', sans-serif; background: var(--rx); color: #06241a; transition: filter .15s, transform .1s; }
  .btn:hover, .go:hover { filter: brightness(1.08); }
  .btn:active, .go:active { transform: scale(.98); }
  #log div b { color: var(--rx); font-weight: 600; margin-inline-end: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  body { display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .radio { width: 100%; max-width: 440px; padding: 26px 22px 28px; border-radius: 28px;
    background: rgba(20,26,34,.85); border: 1px solid var(--line); backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .grille { display: none; }
  .lcd { background: #0d1218; border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-height: 98px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px; transition: border-color .2s, box-shadow .2s; }
  .lcd .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .lcd .status { font-size: 20px; font-weight: 700; color: var(--text); }
  .lcd.tx { border-color: var(--tx); box-shadow: 0 0 24px rgba(255,176,32,.18); } .lcd.tx .status { color: var(--tx); }
  .lcd.rx { border-color: var(--rx); box-shadow: 0 0 24px rgba(61,220,151,.18); } .lcd.rx .status { color: var(--rx); }
  .lcd.err { border-color: var(--err); } .lcd.err .status { color: var(--err); }
  .ptt-wrap { display: flex; justify-content: center; margin: 30px 0 18px; }
  #ptt { width: 200px; height: 200px; border-radius: 50%; border: 1px solid #334256; color: var(--text); cursor: pointer;
    font: 700 18px 'Vazirmatn', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none;
    background: radial-gradient(circle at 50% 30%, #263243, #131a23);
    box-shadow: 0 0 0 9px rgba(255,176,32,.07), 0 20px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .1s, box-shadow .2s; }
  .radio:has(.lcd.rx) #ptt { box-shadow: 0 0 0 9px rgba(61,220,151,.13), 0 20px 44px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); }
  #ptt.active { color: #1b1204; border-color: var(--tx); transform: scale(.96);
    background: radial-gradient(circle at 50% 30%, #ffcf6b, #ff9f0a); animation: pulse 1.2s ease-out infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,176,32,.55), 0 20px 44px rgba(0,0,0,.5); }
                     100% { box-shadow: 0 0 0 30px rgba(255,176,32,0), 0 20px 44px rgba(0,0,0,.5); } }
  #ptt:disabled { opacity: .4; cursor: not-allowed; }
  .hint { text-align: center; font-size: 13px; color: var(--muted); margin: 0; }
  .link { background: none; border: 0; color: var(--muted); font: 400 13px 'Vazirmatn', sans-serif; cursor: pointer; display: block; margin: 18px auto 0; text-decoration: underline; }
  #vid { display: block; width: 100%; border-radius: 16px; margin-top: 14px; background: #000; border: 1px solid var(--line); }
  .opts { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-top: 14px; color: var(--muted); }
  .opts label { margin: 0; font-weight: 400; display: flex; gap: 8px; align-items: center; }
  .opts input { accent-color: var(--rx); }
  .users { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
  #log { height: 160px; overflow-y: auto; background: #0d1218; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-top: 18px; font-size: 14px; }
  #log div { padding: 4px 0; word-break: break-word; }
  .chatbar { display: flex; gap: 8px; margin-top: 8px; }
  .chatbar .btn { width: auto; margin: 0; padding: 0 20px; font-size: 15px; }
</style>
</head>
<body>
<main class="radio">
  <div class="grille" aria-hidden="true"></div>

  <!-- صفحه‌ی ورود -->
  <section id="join">
    <h1>واکی تاکی آنلاین</h1>
    <p class="sub">با هر کسی که در همین کانال باشد حرف بزنید.</p>
    <label for="name">نام شما</label>
    <input id="name" maxlength="30" autocomplete="nickname" placeholder="مثلاً علی">
    <label for="room">نام کانال</label>
    <input id="room" maxlength="40" placeholder="عمومی">
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="joinBtn">ورود به کانال</button>
  </section>

  <!-- صفحه‌ی واکی تاکی -->
  <section id="radio" hidden>
    <div class="lcd" id="lcd">
      <div class="row"><span id="roomTitle"></span><span id="count"></span></div>
      <div class="status" id="status">در حال اتصال…</div>
    </div>
    <img id="vid" alt="تصویر گوینده" hidden>
    <div class="opts"><label><input type="checkbox" id="cam" style="width:auto"> ارسال تصویر وبکم هنگام صحبت</label></div>
    <p class="users" id="users"></p>
    <div class="ptt-wrap">
      <button id="ptt" disabled aria-label="نگه دارید و صحبت کنید">نگه دار و صحبت کن</button>
    </div>
    <p class="hint">دکمه را نگه دارید یا کلید Space را فشار دهید. با رها کردن، صدا قطع می‌شود.</p>
    <div id="log" aria-live="polite"></div>
    <div class="chatbar"><input id="chatIn" maxlength="500" placeholder="پیام بنویسید…"><button class="btn" id="chatBtn">ارسال</button></div>
    <button class="link" id="leave">خروج از کانال</button>
  </section>
</main>

<script>
// بعد از دیپلوی روی Render، آدرس سرور خودتان را اینجا بگذارید (با wss://)
const PROD_WS_URL = 'wss://wakitaki-github-io.onrender.com';
const WS_URL = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'ws://localhost:3000' : PROD_WS_URL;
const SAMPLE_RATE = 16000;

const $ = (id) => document.getElementById(id);
let ws, ctx, micStream, workletNode;
let joined = false, connected = false, talking = false, receiving = false;
let nextTime = 0, pending = [], pendingLen = 0, reconnectTimer = null, cfg = {};
let denied = null;
// صدای فشرده (Opus) در صورت پشتیبانی مرورگر، وگرنه PCM
const OPUS_RATE = 48000, FRAME = 960; // ۲۰ میلی‌ثانیه
let encoder = null, decoder = null, useOpus = false;
let opusBuf = new Float32Array(0), opusTs = 0, decTs = 0, lead = 0.3;

try {
  $('name').value = localStorage.getItem('wt-name') || '';
  $('room').value = localStorage.getItem('wt-room') || '';
} catch (e) {}

const workletCode = `
class Cap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor('cap', Cap);`;

function setStatus(text, mode) {
  $('status').textContent = text;
  $('lcd').className = 'lcd' + (mode ? ' ' + mode : '');
}

function refreshIdle() {
  if (!connected) return setStatus('در حال اتصال…');
  setStatus('کانال آزاد است');
}

async function join() {
  const name = $('name').value.trim() || 'ناشناس';
  const room = $('room').value.trim() || 'عمومی';
  $('err').textContent = '';
  try { localStorage.setItem('wt-name', name); localStorage.setItem('wt-room', room); } catch (e) {}

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    try { ctx = new AC({ sampleRate: OPUS_RATE }); } catch (e) { ctx = new AC(); }
    await ctx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    });
    await setupCapture();
    await setupEncoder();
  } catch (e) {
    $('err').textContent = 'دسترسی به میکروفن ممکن نشد. اجازه‌ی میکروفن را در مرورگر فعال کنید و دوباره امتحان کنید.';
    return;
  }

  cfg = { name, room };
  joined = true;
  $('join').hidden = true;
  $('radio').hidden = false;
  $('roomTitle').textContent = 'کانال: ' + room;
  $('count').textContent = '';
  setStatus('در حال اتصال…');
  connect();
}

async function setupCapture() {
  const url = URL.createObjectURL(new Blob([workletCode], { type: 'application/javascript' }));
  await ctx.audioWorklet.addModule(url);
  const src = ctx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(ctx, 'cap');
  const mute = ctx.createGain();
  mute.gain.value = 0; // برای اینکه صدای خودتان پخش نشود
  src.connect(workletNode);
  workletNode.connect(mute);
  mute.connect(ctx.destination);
  workletNode.port.onmessage = (e) => {
    if (!talking) return;
    if (useOpus) return feedOpus(e.data);
    pending.push(e.data);
    pendingLen += e.data.length;
    if (pendingLen >= 4096) flush();
  };
}

async function setupEncoder() {
  useOpus = false;
  if (!window.AudioEncoder || !window.AudioData || ctx.sampleRate !== OPUS_RATE) return;
  try {
    const conf = { codec: 'opus', sampleRate: OPUS_RATE, numberOfChannels: 1, bitrate: 24000 };
    const sup = await AudioEncoder.isConfigSupported(conf);
    if (!sup.supported) return;
    encoder = new AudioEncoder({
      output: (chunk) => {
        if (!ws || ws.readyState !== 1) return;
        const b = new Uint8Array(chunk.byteLength + 1);
        b[0] = 1; // برچسب: Opus
        chunk.copyTo(b.subarray(1));
        ws.send(b.buffer);
      },
      error: () => { useOpus = false; },
    });
    encoder.configure(conf);
    useOpus = true;
  } catch (e) { useOpus = false; }
}

function feedOpus(chunk) {
  const merged = new Float32Array(opusBuf.length + chunk.length);
  merged.set(opusBuf);
  merged.set(chunk, opusBuf.length);
  let off = 0;
  while (merged.length - off >= FRAME) {
    const ad = new AudioData({
      format: 'f32-planar', sampleRate: OPUS_RATE, numberOfFrames: FRAME,
      numberOfChannels: 1, timestamp: opusTs, data: merged.slice(off, off + FRAME),
    });
    encoder.encode(ad);
    ad.close();
    opusTs += 20000;
    off += FRAME;
  }
  opusBuf = merged.slice(off);
}

function flush() {
  if (!pendingLen) return;
  const all = new Float32Array(pendingLen);
  let o = 0;
  for (const p of pending) { all.set(p, o); o += p.length; }
  pending = []; pendingLen = 0;

  const ratio = ctx.sampleRate / SAMPLE_RATE;
  const len = Math.floor(all.length / ratio);
  const out = new Int16Array(len);
  for (let i = 0; i < len; i++) {
    const s = Math.floor(i * ratio);
    const e = Math.max(s + 1, Math.min(Math.floor((i + 1) * ratio), all.length));
    let sum = 0;
    for (let j = s; j < e; j++) sum += all[j];
    const v = Math.max(-1, Math.min(1, sum / (e - s)));
    out[i] = v < 0 ? v * 32768 : v * 32767;
  }
  if (ws && ws.readyState === 1) {
    const b = new Uint8Array(out.byteLength + 1);
    b[0] = 0; // برچسب: PCM
    b.set(new Uint8Array(out.buffer), 1);
    ws.send(b.buffer);
  }
}

function onDenied() {
  const why = denied; denied = null;
  if (why === 'password') {
    const pw = prompt('این کانال رمز دارد. رمز را وارد کنید:');
    if (pw) { cfg.pw = pw; return connect(); }
  } else alert(why === 'locked' ? 'این کانال قفل است.' : why === 'full' ? 'ظرفیت این کانال پر است.' : 'ورود ممکن نشد.');
  $('leave').click();
}

function connect() {
  clearTimeout(reconnectTimer);
  const q = new URLSearchParams({ room: cfg.room, name: cfg.name, ...(cfg.pw ? { pw: cfg.pw } : {}) });
  ws = new WebSocket(WS_URL + '/?' + q);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    connected = true;
    $('ptt').disabled = false;
    refreshIdle();
  };
  ws.onclose = () => {
    connected = false;
    receiving = false;
    stopTalking(false);
    $('ptt').disabled = true;
    if (denied) return onDenied();
    if (joined) {
      setStatus('اتصال قطع شد، در حال تلاش دوباره…', 'err');
      reconnectTimer = setTimeout(connect, 2000);
    }
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') return onAudio(ev.data);
    const m = JSON.parse(ev.data);
    if (m.type === 'presence') { $('count').textContent = m.count + ' نفر آنلاین'; $('users').textContent = (m.users || []).join('، '); }
    else if (m.type === 'history') { $('log').textContent = ''; m.msgs.forEach(addMsg); }
    else if (m.type === 'chat') addMsg(m);
    else if (m.type === 'deleted') { const e = $('log').querySelector('[data-id="' + m.id + '"]'); if (e) e.remove(); }
    else if (m.type === 'kicked') { joined = false; setStatus('ادمین شما را از کانال خارج کرد', 'err'); }
    else if (m.type === 'system') addMsg({ id: 's' + Date.now(), name: 'سیستم', text: m.text });
    else if (m.type === 'renamed') { cfg.room = m.room; $('roomTitle').textContent = 'کانال: ' + m.room; }
    else if (m.type === 'denied') denied = m.reason;
    else if (m.type === 'talking') { receiving = true; nextTime = 0; setStatus(m.name + ' صحبت می‌کند', 'rx'); $('vid').hidden = !m.video; }
    else if (m.type === 'idle') { receiving = false; $('vid').hidden = true; if (!talking) refreshIdle(); }
    else if (m.type === 'busy') { stopTalking(false); setStatus('کانال مشغول است: ' + m.name, 'err'); }
  };
}

function onAudio(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0) {
    const i16 = new Int16Array(buf.slice(1));
    const f = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f[i] = i16[i] / 32768;
    schedule(f, SAMPLE_RATE);
  } else if (u8[0] === 2) {
    const url = URL.createObjectURL(new Blob([u8.subarray(1)], { type: 'image/jpeg' }));
    const old = $('vid').src;
    $('vid').src = url;
    if (old.startsWith('blob:')) URL.revokeObjectURL(old);
  } else if (u8[0] === 1) {
    if (!window.AudioDecoder) { setStatus('مرورگر شما این نوع صدا را پشتیبانی نمی‌کند', 'err'); return; }
    ensureDecoder();
    decoder.decode(new EncodedAudioChunk({ type: 'key', timestamp: decTs, data: u8.subarray(1) }));
    decTs += 20000;
  }
}

function ensureDecoder() {
  if (decoder && decoder.state === 'configured') return;
  decoder = new AudioDecoder({
    output: (ad) => {
      const f = new Float32Array(ad.numberOfFrames);
      ad.copyTo(f, { planeIndex: 0, format: 'f32-planar' });
      const rate = ad.sampleRate;
      ad.close();
      schedule(f, rate);
    },
    error: () => { decoder = null; },
  });
  decoder.configure({ codec: 'opus', sampleRate: OPUS_RATE, numberOfChannels: 1 });
}

// پخش پیوسته با بافر تطبیقی: هر بار صدا قطع شود، بافر کمی بزرگ‌تر می‌شود
function schedule(f, rate) {
  if (!f.length) return;
  const ab = ctx.createBuffer(1, f.length, rate);
  ab.copyToChannel(f, 0);
  const s = ctx.createBufferSource();
  s.buffer = ab;
  s.connect(ctx.destination);
  const now = ctx.currentTime;
  if (nextTime < now) {
    if (nextTime !== 0) lead = Math.min(0.8, lead + 0.1);
    nextTime = now + lead;
  }
  s.start(nextTime);
  nextTime += ab.duration;
}

function startTalking() {
  if (talking || !connected) return;
  if (receiving) { setStatus('کانال مشغول است', 'err'); return; }
  talking = true;
  ctx.resume();
  const wantVideo = $('cam').checked;
  ws.send(JSON.stringify({ type: 'start', video: wantVideo }));
  if (wantVideo) startVideo();
  $('ptt').classList.add('active');
  setStatus('در حال ارسال…', 'tx');
}

async function stopTalking(notify = true) {
  if (!talking) return;
  talking = false;
  clearInterval(vidTimer);
  $('ptt').classList.remove('active');
  if (useOpus && encoder && encoder.state === 'configured') {
    opusBuf = new Float32Array(0);
    try { await encoder.flush(); } catch (e) {}
  } else {
    flush();
  }
  if (notify && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' }));
  if (connected && !receiving) refreshIdle();
}

let camStream = null, vidTimer = null;
const camVideo = document.createElement('video'), camCanvas = document.createElement('canvas');
async function startVideo() {
  try {
    if (!camStream) {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
      camVideo.srcObject = camStream; camVideo.muted = true; await camVideo.play();
    }
  } catch (e) { setStatus('دسترسی به وبکم ممکن نشد', 'err'); return; }
  camCanvas.width = 320; camCanvas.height = 240;
  const g = camCanvas.getContext('2d');
  clearInterval(vidTimer);
  vidTimer = setInterval(() => {
    if (!talking) return;
    g.drawImage(camVideo, 0, 0, 320, 240);
    camCanvas.toBlob(async (b) => {
      if (!b || !talking || !ws || ws.readyState !== 1) return;
      const u = new Uint8Array(await b.arrayBuffer()), o = new Uint8Array(u.length + 1);
      o[0] = 2; o.set(u, 1); ws.send(o.buffer);
    }, 'image/jpeg', 0.5);
  }, 200);
}

function addMsg(m) {
  const d = document.createElement('div');
  d.dataset.id = m.id;
  const b = document.createElement('b'); b.textContent = m.name; d.append(b, document.createTextNode(m.text)); // textContent: بدون خطر تزریق HTML
  $('log').appendChild(d);
  $('log').scrollTop = 1e9;
}
function sendChat() {
  const t = $('chatIn').value.trim();
  if (!t || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ type: 'chat', text: t }));
  $('chatIn').value = '';
}
$('chatBtn').addEventListener('click', sendChat);
$('chatIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });

const ptt = $('ptt');
ptt.addEventListener('pointerdown', (e) => { ptt.setPointerCapture(e.pointerId); startTalking(); });
ptt.addEventListener('pointerup', () => stopTalking());
ptt.addEventListener('pointercancel', () => stopTalking());
ptt.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && joined && !e.repeat && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); startTalking();
  }
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space') stopTalking(); });
window.addEventListener('blur', () => stopTalking());

$('joinBtn').addEventListener('click', join);
$('leave').addEventListener('click', () => {
  joined = false;
  stopTalking(false);
  clearTimeout(reconnectTimer);
  if (ws) ws.close();
  clearInterval(vidTimer);
  if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
  try { if (encoder) encoder.close(); } catch (e) {}
  try { if (decoder) decoder.close(); } catch (e) {}
  encoder = null; decoder = null; useOpus = false; opusBuf = new Float32Array(0);
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  $('radio').hidden = true;
  $('join').hidden = false;
});
</script>
</body>
</html>
