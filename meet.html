<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تماس تصویری گروهی | واکی تاکی آنلاین</title>
<meta name="description" content="تماس صوتی و تصویری گروهی ساده، فقط با یک کد اتاق.">
<meta name="theme-color" content="#0b0f14">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f14; --surface:#141a22; --surface2:#1c2530; --line:#263140; --text:#e8edf3; --muted:#8794a6;
          --tx:#ffb020; --rx:#3ddc97; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { font-family: 'Vazirmatn', system-ui, sans-serif; color: var(--text);
    background: radial-gradient(900px 520px at 50% -10%, #17382f 0%, transparent 60%),
                radial-gradient(700px 420px at 100% 100%, #2b2112 0%, transparent 60%), var(--bg);
    background-attachment: fixed; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input, textarea { width: 100%; padding: 12px 14px; font: 400 16px 'Vazirmatn', sans-serif; color: var(--text);
    background: #0d1218; border: 1px solid var(--line); border-radius: 12px; }
  input::placeholder { color: #5d6a7b; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--rx); outline-offset: 2px; }
  h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -.3px; }
  .sub { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .err { color: var(--err); font-size: 13px; min-height: 18px; margin: 10px 0 0; }
  .btn, .go { width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 14px; cursor: pointer;
    font: 800 17px 'Vazirmatn', sans-serif; background: var(--rx); color: #06241a; transition: filter .15s, transform .1s; }
  .btn:hover, .go:hover { filter: brightness(1.08); }
  .btn:active, .go:active { transform: scale(.98); }
  #log div b { color: var(--rx); font-weight: 600; margin-inline-end: 4px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  #lobby { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 380px; padding: 28px 24px; border-radius: 26px; background: rgba(20,26,34,.85);
    border: 1px solid var(--line); backdrop-filter: blur(14px); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .note { font-size: 12px; color: var(--muted); margin: 12px 0 0; }
  #call { height: 100vh; display: flex; flex-direction: column; }
  .main { flex: 1; display: flex; min-height: 0; padding-bottom: 92px; }
  #grid { flex: 1; display: grid; gap: 12px; padding: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); grid-auto-rows: minmax(180px, 1fr); overflow: auto; }
  .tile { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; min-height: 180px; }
  .tile img, .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .tile video.me { transform: scaleX(-1); }
  .av { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .av span { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #3ddc97, #1fa6c9); color: #04241c; font: 800 36px 'Vazirmatn'; }
  .nm { position: absolute; bottom: 12px; right: 12px; padding: 4px 12px; border-radius: 999px; font-size: 13px;
    background: rgba(11,15,20,.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08); }
  #chat { width: 300px; margin: 16px 0 16px 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
  #log { flex: 1; overflow-y: auto; font-size: 14px; }
  #log div { padding: 4px 0; word-break: break-word; }
  .bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 10;
    display: flex; gap: 8px; padding: 8px; border-radius: 999px; background: rgba(20,26,34,.82);
    backdrop-filter: blur(16px); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  .bar button { border: 0; border-radius: 999px; padding: 12px 20px; cursor: pointer; white-space: nowrap;
    font: 600 15px 'Vazirmatn', sans-serif; background: var(--surface2); color: var(--text); transition: filter .15s; }
  .bar button:hover { filter: brightness(1.2); }
  .bar button.off { background: rgba(255,107,107,.16); color: #ff9a9a; }
  .bar button.leave { background: var(--err); color: #2a0606; }
  @media (max-width: 640px) { #chat { position: fixed; inset: 0 0 92px 0; width: auto; margin: 0; border-radius: 0; z-index: 5; }
    .bar button { padding: 11px 14px; font-size: 14px; } }
  /* سبک‌تر: بدون blur روی تصویر زنده */
  body { background-attachment: scroll; } #call { background: var(--bg); }
  .nm { background: rgba(11,15,20,.82); backdrop-filter: none; } .bar { background: #141a22; backdrop-filter: none; }
</style>
</head>
<body>
<section id="lobby">
  <div class="card">
    <h1>تماس تصویری</h1>
    <label for="name">نام شما</label>
    <input id="name" maxlength="30" placeholder="مثلاً علی">
    <label for="room">کد اتاق</label>
    <input id="room" maxlength="40" placeholder="مثلاً جلسه-۱">
    <p class="err" id="err" role="alert"></p>
    <p class="sub">با حساب پیام‌رسان وارد می‌شوید. <a href="https://hoseinxrad-glitch.github.io/hmash.github.io/" style="color:var(--rx)">ورود یا ثبت‌نام در پیام‌رسان</a></p>
    <button class="go" id="join">ورود به تماس</button>
    <p class="note">برای جلوگیری از بازخورد صدا از هدفون استفاده کنید. فقط Chrome و Edge جدید پشتیبانی می‌شوند.</p>
  </div>
</section>

<section id="call" hidden>
  <div class="main">
    <div id="grid"></div>
    <aside id="chat" hidden>
      <div id="log" aria-live="polite"></div>
      <input id="chatIn" maxlength="500" placeholder="پیام بنویسید…">
    </aside>
  </div>
  <nav class="bar">
    <button id="micBtn">میکروفن</button>
    <button id="camBtn" class="off">دوربین خاموش</button>
    <button id="chatBtn">چت</button>
    <button id="leave" class="leave">خروج</button>
  </nav>
</section>

<script>
const PROD_WS_URL = 'wss://wakitaki-github-io.onrender.com';
const WS_URL = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'ws://localhost:3000' : PROD_WS_URL;
const RATE = 48000, FRAME = 960, W = 320, H = 240;
const $ = (id) => document.getElementById(id);

let ws, ctx, micStream, camStream, encoder, joined = false, micOn = true, camOn = false;
let myId = -1, cfg = {}, opusBuf = new Float32Array(0), opusTs = 0, vidTimer = null, reconnect = null;
const peers = new Map(); // id -> { name, tile, img, av, dec, next, lead, last, lastVid, ts }
let denied = null;
const camVideo = document.createElement('video'), camCanvas = document.createElement('canvas');

try { $('name').value = localStorage.getItem('mt-name') || ''; $('room').value = localStorage.getItem('mt-room') || ''; } catch (e) {}
// لینک مستقیم از پیام‌رسان: ?room=نام&name=اسم فرم ورود را از قبل پر می‌کند
try { const u = new URLSearchParams(location.search); if (u.get('name')) $('name').value = u.get('name'); if (u.get('room')) $('room').value = u.get('room'); } catch (e) {}

// ورود یکپارچه: با حساب پیام‌رسان وارد می‌شوید و اسم شما قابل تغییر نیست
const MESSENGER = 'https://hoseinxrad-glitch.github.io/hmash.github.io/';
function msToken() { try { return localStorage.getItem('ms-token') || ''; } catch (e) { return ''; } }
function msUser() { try { return localStorage.getItem('ms-user') || ''; } catch (e) { return ''; } }
if (msUser()) { $('name').value = msUser(); $('name').readOnly = true; }

function makeTile(name, local) {
  const t = document.createElement('div'); t.className = 'tile';
  const av = document.createElement('div'); av.className = 'av';
  const sp = document.createElement('span'); sp.textContent = (name || '؟').trim().charAt(0); av.append(sp);
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name;
  let media;
  if (local) { media = camVideo; camVideo.className = 'me'; camVideo.muted = true; camVideo.playsInline = true; }
  else media = document.createElement('img');
  media.hidden = true;
  t.append(av, media, nm);
  $('grid').append(t);
  return { tile: t, av, img: media };
}

async function join() {
  if (!msToken()) { $('err').textContent = 'برای ورود، اول در پیام‌رسان وارد شوید یا ثبت‌نام کنید.'; return; }
  const name = msUser() || $('name').value.trim() || 'ناشناس', room = $('room').value.trim() || 'عمومی';
  $('err').textContent = '';
  if (!window.AudioEncoder || !window.AudioDecoder) { $('err').textContent = 'مرورگر شما پشتیبانی نمی‌کند. از Chrome یا Edge جدید استفاده کنید.'; return; }
  try { localStorage.setItem('mt-name', name); localStorage.setItem('mt-room', room); } catch (e) {}
  try {
    ctx = new AudioContext({ sampleRate: RATE });
    await ctx.resume();
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    await setupCapture();
  } catch (e) { $('err').textContent = 'دسترسی به میکروفن ممکن نشد. اجازه‌ی میکروفن را فعال کنید.'; return; }
  cfg = { name, room };
  joined = true;
  $('lobby').hidden = true; $('call').hidden = false;
  const me = makeTile(name + ' (شما)', true); me.img.hidden = true; peers.set('me', me);
  connect();
}

async function setupCapture() {
  const code = `class Cap extends AudioWorkletProcessor { process(i) { const c = i[0] && i[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } } registerProcessor('cap', Cap);`;
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
  const src = ctx.createMediaStreamSource(micStream), node = new AudioWorkletNode(ctx, 'cap'), mute = ctx.createGain();
  mute.gain.value = 0;
  src.connect(node); node.connect(mute); mute.connect(ctx.destination);
  const conf = { codec: 'opus', sampleRate: RATE, numberOfChannels: 1, bitrate: 24000 };
  encoder = new AudioEncoder({
    output: (c) => { if (!ws || ws.readyState !== 1) return; const b = new Uint8Array(c.byteLength + 1); b[0] = 1; c.copyTo(b.subarray(1)); ws.send(b.buffer); },
    error: () => {},
  });
  encoder.configure(conf);
  node.port.onmessage = (e) => { if (micOn && joined) feedOpus(e.data); };
}

function feedOpus(chunk) {
  const m = new Float32Array(opusBuf.length + chunk.length);
  m.set(opusBuf); m.set(chunk, opusBuf.length);
  let off = 0;
  while (m.length - off >= FRAME) {
    const ad = new AudioData({ format: 'f32-planar', sampleRate: RATE, numberOfFrames: FRAME, numberOfChannels: 1, timestamp: opusTs, data: m.slice(off, off + FRAME) });
    if (encoder.state === 'configured') encoder.encode(ad);
    ad.close(); opusTs += 20000; off += FRAME;
  }
  opusBuf = m.slice(off);
}

function onDenied() {
  const why = denied; denied = null;
  if (why === 'password') {
    const pw = prompt('این کانال رمز دارد. رمز را وارد کنید:');
    if (pw) { cfg.pw = pw; return connect(); }
  } else alert(why === 'locked' ? 'این کانال قفل است.' : why === 'full' ? 'ظرفیت این کانال پر است.' : why === 'auth' ? 'نشست شما معتبر نیست؛ دوباره در پیام‌رسان وارد شوید.' : 'ورود ممکن نشد.');
  leave();
}

function connect() {
  clearTimeout(reconnect);
  ws = new WebSocket(WS_URL + '/?' + new URLSearchParams({ room: cfg.room, name: cfg.name, mode: 'meet', token: msToken(), ...(cfg.pw ? { pw: cfg.pw } : {}) }));
  ws.binaryType = 'arraybuffer';
  ws.onclose = () => { if (denied) return onDenied(); if (joined) reconnect = setTimeout(connect, 2000); };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== 'string') {
      const u = new Uint8Array(ev.data), p = peers.get((u[0] << 8) | u[1]);
      if (!p) return;
      if (u[2] === 1) playOpus(p, u.subarray(3)); else if (u[2] === 2) showFrame(p, u.subarray(3));
      return;
    }
    const m = JSON.parse(ev.data);
    if (m.type === 'you') myId = m.id;
    else if (m.type === 'peers') syncPeers(m.peers);
    else if (m.type === 'history') { $('log').textContent = ''; m.msgs.forEach(addMsg); }
    else if (m.type === 'chat') addMsg(m);
    else if (m.type === 'deleted') { const e = $('log').querySelector('[data-id="' + m.id + '"]'); if (e) e.remove(); }
    else if (m.type === 'kicked') { joined = false; alert('ادمین شما را از تماس خارج کرد'); leave(); }
    else if (m.type === 'system') { addMsg({ id: 's' + Date.now(), name: 'سیستم', text: m.text }); $('chat').hidden = false; }
    else if (m.type === 'renamed') cfg.room = m.room.replace(/^meet:/, '');
    else if (m.type === 'denied') denied = m.reason;
  };
}

function syncPeers(list) {
  const ids = new Set(list.map((x) => x.id));
  for (const [id, p] of peers) if (id !== 'me' && !ids.has(id)) { p.tile.remove(); try { p.dec && p.dec.close(); } catch (e) {} peers.delete(id); }
  for (const x of list) if (x.id !== myId && !peers.has(x.id)) {
    const t = makeTile(x.name, false);
    peers.set(x.id, { name: x.name, tile: t.tile, av: t.av, img: t.img, dec: null, next: 0, lead: 0.3, last: 0, lastVid: 0 });
  }
}

function playOpus(p, data) {
  const now = performance.now();
  if (now - p.last > 1000) p.next = 0; // شروع دوباره بعد از سکوت
  p.last = now;
  if (!p.dec || p.dec.state !== 'configured') {
    p.dec = new AudioDecoder({
      output: (ad) => { const f = new Float32Array(ad.numberOfFrames); ad.copyTo(f, { planeIndex: 0, format: 'f32-planar' }); ad.close(); schedule(p, f); },
      error: () => { p.dec = null; },
    });
    p.dec.configure({ codec: 'opus', sampleRate: RATE, numberOfChannels: 1 });
    p.ts = 0;
  }
  p.dec.decode(new EncodedAudioChunk({ type: 'key', timestamp: p.ts, data })); p.ts += 20000;
}

function schedule(p, f) {
  if (!f.length) return;
  const ab = ctx.createBuffer(1, f.length, RATE); ab.copyToChannel(f, 0);
  const s = ctx.createBufferSource(); s.buffer = ab; s.connect(ctx.destination);
  const t = ctx.currentTime, nowMs = performance.now();
  if (p.next - t > p.lead + 0.3) return; // صف پخش خیلی عقب است: فریم‌های اضافه را دور بریز تا تأخیر جمع نشود
  if (p.next < t) { if (p.next !== 0) { p.lead = Math.min(0.8, p.lead + 0.1); p.grew = nowMs; } p.next = t + p.lead; }
  else if (p.lead > 0.25 && nowMs - (p.grew || 0) > 15000) { p.lead -= 0.05; p.grew = nowMs; } // بافر دوباره کوچک می‌شود
  s.start(p.next); p.next += ab.duration;
}

function showFrame(p, data) {
  const old = p.img.src;
  p.img.src = URL.createObjectURL(new Blob([data], { type: 'image/jpeg' }));
  if (old && old.startsWith('blob:')) URL.revokeObjectURL(old);
  p.img.hidden = false; p.av.hidden = true; p.lastVid = performance.now();
}
setInterval(() => { // اگر تصویری نرسید، آواتار نشان بده
  for (const [id, p] of peers) if (id !== 'me' && !p.img.hidden && performance.now() - p.lastVid > 1500) { p.img.hidden = true; p.av.hidden = false; }
}, 500);

const LV = [[320, 240, 0.5, 170], [240, 180, 0.42, 250], [160, 120, 0.35, 400]]; // کیفیت تطبیقی بر اساس شلوغی شبکه
let lv = 0, busy = 0, calm = 0;
function camLoop() {
  if (!camOn) return;
  const [w, h, q, ms] = LV[lv];
  if (ws && ws.readyState === 1 && ws.bufferedAmount < 8192) { // اگر شبکه عقب است فریم نفرست تا صدا عقب نیفتد
    if (camCanvas.width !== w) { camCanvas.width = w; camCanvas.height = h; }
    camCanvas.getContext('2d').drawImage(camVideo, 0, 0, w, h);
    camCanvas.toBlob(async (b) => {
      if (!b || !camOn || !ws || ws.readyState !== 1 || ws.bufferedAmount > 16384) return;
      const u = new Uint8Array(await b.arrayBuffer()), o = new Uint8Array(u.length + 1);
      o[0] = 2; o.set(u, 1); ws.send(o.buffer);
    }, 'image/jpeg', q);
    busy = 0; if (++calm > 30 && lv > 0) { lv--; calm = 0; }
  } else { calm = 0; if (++busy >= 3 && lv < LV.length - 1) { lv++; busy = 0; } }
  vidTimer = setTimeout(camLoop, ms);
}

async function toggleCam() {
  const me = peers.get('me');
  if (camOn) {
    camOn = false; clearInterval(vidTimer);
    if (camStream) camStream.getTracks().forEach((t) => t.stop()); camStream = null;
    me.img.hidden = true; me.av.hidden = false;
    $('camBtn').textContent = 'دوربین خاموش'; $('camBtn').classList.add('off');
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { width: W, height: H, frameRate: { ideal: 10 } } });
    camVideo.srcObject = camStream; await camVideo.play();
  } catch (e) { alert('دسترسی به دوربین ممکن نشد'); return; }
  camOn = true; me.img.hidden = false; me.av.hidden = true;
  $('camBtn').textContent = 'دوربین روشن'; $('camBtn').classList.remove('off');
  lv = 0; busy = 0; calm = 0;
  camLoop();
}

function addMsg(m) {
  const d = document.createElement('div'); d.dataset.id = m.id; const b = document.createElement('b'); b.textContent = m.name; d.append(b, document.createTextNode(m.text));
  $('log').append(d); $('log').scrollTop = 1e9;
}

function leave() {
  joined = false; clearTimeout(reconnect); clearInterval(vidTimer);
  if (ws) ws.close();
  [micStream, camStream].forEach((s) => s && s.getTracks().forEach((t) => t.stop()));
  try { encoder.close(); } catch (e) {}
  for (const p of peers.values()) { try { p.dec && p.dec.close(); } catch (e) {} }
  if (ctx) ctx.close();
  peers.clear(); $('grid').textContent = ''; camOn = false; micOn = true; myId = -1;
  $('micBtn').classList.remove('off'); $('micBtn').textContent = 'میکروفن';
  $('camBtn').textContent = 'دوربین خاموش'; $('camBtn').classList.add('off');
  $('call').hidden = true; $('lobby').hidden = false;
}

$('join').onclick = join;
$('leave').onclick = leave;
$('camBtn').onclick = toggleCam;
$('chatBtn').onclick = () => { $('chat').hidden = !$('chat').hidden; };
$('micBtn').onclick = () => {
  micOn = !micOn;
  $('micBtn').classList.toggle('off', !micOn);
  $('micBtn').textContent = micOn ? 'میکروفن' : 'میکروفن خاموش';
};
$('chatIn').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const t = $('chatIn').value.trim();
  if (t && ws && ws.readyState === 1) { ws.send(JSON.stringify({ type: 'chat', text: t })); $('chatIn').value = ''; }
});
</script>
</body>
</html>
